<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 48" fill="none">
  <defs>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-hard" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Outer diffuse glow (very wide, low opacity) -->
  <path d="M36,24 C33,13 28,8 22,8 C13,8 7,15 7,24 C7,33 13,40 22,40 C28,40 33,35 36,24 C39,13 44,8 50,8 C59,8 65,15 65,24 C65,33 59,40 50,40 C44,40 39,35 36,24 Z"
    stroke="#f97316" stroke-width="10" fill="none" opacity="0.12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mid glow -->
  <path d="M36,24 C33,13 28,8 22,8 C13,8 7,15 7,24 C7,33 13,40 22,40 C28,40 33,35 36,24 C39,13 44,8 50,8 C59,8 65,15 65,24 C65,33 59,40 50,40 C44,40 39,35 36,24 Z"
    stroke="url(#g-left)" stroke-width="5" fill="none" opacity="0.35" filter="url(#glow-soft)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main stroke -->
  <path d="M36,24 C33,13 28,8 22,8 C13,8 7,15 7,24 C7,33 13,40 22,40 C28,40 33,35 36,24 C39,13 44,8 50,8 C59,8 65,15 65,24 C65,33 59,40 50,40 C44,40 39,35 36,24 Z"
    stroke="url(#g-right)" stroke-width="3" fill="none" filter="url(#glow-hard)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bright centre highlight -->
  <path d="M36,24 C33.5,15 29.5,10.5 22,10.5 C14,10.5 9.5,16 9.5,24 C9.5,32 14,37.5 22,37.5 C29.5,37.5 33.5,33 36,24 C38.5,15 42.5,10.5 50,10.5 C58,10.5 62.5,16 62.5,24 C62.5,32 58,37.5 50,37.5 C42.5,37.5 38.5,33 36,24 Z"
    stroke="rgba(255,220,130,0.7)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dot arc — left side particles -->
  <circle cx="15" cy="8"  r="2"   fill="#fbbf24" opacity="0.75" filter="url(#glow-hard)"/>
  <circle cx="10" cy="13" r="2.5" fill="#f97316" opacity="0.85" filter="url(#glow-hard)"/>
  <circle cx="7"  cy="19" r="3"   fill="#f05808" opacity="0.95" filter="url(#glow-hard)"/>
  <circle cx="7"  cy="24" r="3.2" fill="#f05808" opacity="1"   filter="url(#glow-hard)"/>
  <circle cx="7"  cy="29" r="3"   fill="#f05808" opacity="0.95" filter="url(#glow-hard)"/>
  <circle cx="10" cy="35" r="2.5" fill="#f97316" opacity="0.85" filter="url(#glow-hard)"/>
  <circle cx="15" cy="40" r="2"   fill="#fbbf24" opacity="0.75" filter="url(#glow-hard)"/>

  <!-- Tiny trailing dots -->
  <circle cx="20" cy="5"  r="1.2" fill="#fcd34d" opacity="0.5"/>
  <circle cx="26" cy="3"  r="0.9" fill="#fcd34d" opacity="0.35"/>
  <circle cx="20" cy="43" r="1.2" fill="#fcd34d" opacity="0.5"/>
  <circle cx="26" cy="45" r="0.9" fill="#fcd34d" opacity="0.35"/>
</svg>
